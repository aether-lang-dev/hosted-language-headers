# The lua bridge is no longer in the Aether release: it lives in the
# aether-guest-languages package, added with `ae add
# github.com/aether-lang-dev/aether-guest-languages` and used here as
# `import lua`. The package has no tagged releases, so the dependency is its
# default branch, pinned by the hash of the tree below; if main has moved on and
# the fetch fails the hash check, run `ae add` again to re-pin.
#
# No link flags: the bridge is compiled into the program (its @source) and loads
# the machine's lua library at run time, so a machine needs the interpreter's
# runtime library, not its dev package.

[dependencies]
"github.com/aether-lang-dev/aether-guest-languages" = "latest"

[dependency-hashes]
"github.com/aether-lang-dev/aether-guest-languages" = "sha256-0292c38548d328e677eaff2961a805946cb07da5f728797cde1176f6874b6cac"
